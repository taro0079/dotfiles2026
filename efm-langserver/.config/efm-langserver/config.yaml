version: 2
# root-markers:
#     - composer.json
tools:
    phpmd: &phpmd
        lint-command: 'vendor/binphpmd "${INPUT}" text .phpmd/phpmd.xml'
        lint-stdin: false
        lint-after-save: true
        lint-ignore-exit-code: true
        lint-formats:
            - '%f:%l%\t%m'
    php-phpstan: &php-phpstan
        lint-command: 'phpstan analyse --error-format raw --no-progress  -c phpstan.dist.neon'
    # rpst-api: phpstan を devcontainer 内で実行する。
    # ホスト絶対パス ${INPUT} をリポジトリルートからの相対パスに変換して渡す。
    # phpstan は相対パスで出力するので efm がリポジトリルート基準で解決できる。
    # 注意: `docker compose run` は起動に数秒かかる。常駐 devcontainer があるなら
    # `run --rm` を `exec` に変えると高速化できる。
    php-phpstan-docker: &php-phpstan-docker
        lint-command: >-
            bash -c '
            root="$(git rev-parse --show-toplevel)";
            rel="${INPUT#${root}/}";
            cd "${root}" &&
            docker compose run --rm -T -w /srv devcontainer
            phpstan analyse --error-format=raw --no-progress --no-interaction
            -c app/phpstan.dist.neon "${rel}"
            '
        lint-stdin: false
        lint-after-save: true
        lint-ignore-exit-code: true
        lint-formats:
            - '%f:%l:%m'
        root-markers:
            - app/phpstan.dist.neon
            - composer.json
    # rpst-api: php-cs-fixer をフォーマッタとして devcontainer 内で実行。
    php-cs-fixer-docker: &php-cs-fixer-docker
        format-command: >-
            bash -c '
            root="$(git rev-parse --show-toplevel)";
            rel="${INPUT#${root}/}";
            cd "${root}" &&
            docker compose run --rm -T -w /srv devcontainer
            php-cs-fixer fix --using-cache=no --quiet "${rel}"
            && cat "${INPUT}"
            '
        format-stdin: false
    php-mago-analyze: &php-mago-analyse
        lint-command: 'mago analyze --reporting-format emacs --stdin-input ${INPUT}'
        lint-stdin: true
        lint-formats:
            - '%f:%l:%c:%m'
    php-mago-lint: &php-mago-lint
        lint-command: 'mago lint --reporting-format emacs --stdin-input ${INPUT}'
        lint-stdin: true
        lint-formats:
            - '%f:%l:%c:%m'
languages:
    php:
        - <<: *php-phpstan-docker
        - <<: *php-cs-fixer-docker
        # - <<: *php-mago-analyse
        # - <<: *php-mago-lint
